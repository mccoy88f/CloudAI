name: cloudai

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    environment:
      # Coolify genera il dominio e lo collega alla porta 80 di questo servizio.
      - SERVICE_FQDN_WEB_80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cloudai:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/cloudai
      APP_SECRET: ${SERVICE_PASSWORD_APP:?set SERVICE_PASSWORD_APP}
      RUNNER_URL: http://runner:4000
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      runner:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4000"
      WORKSPACES_DIR: /workspaces
      ENGINES_DIR: /engines
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-preview.invalid}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.cloudai-preview.rule=HostRegexp(`{name:[a-z0-9-]+}.${PREVIEW_DOMAIN:-preview.invalid}`)"
      - traefik.http.routers.cloudai-preview.entrypoints=https
      - traefik.http.routers.cloudai-preview.tls=true
      - traefik.http.routers.cloudai-preview.tls.certresolver=letsencrypt
      - traefik.http.routers.cloudai-preview.priority=1
      - traefik.http.routers.cloudai-preview.service=cloudai-preview
      - traefik.http.services.cloudai-preview.loadbalancer.server.port=4000
    expose:
      - "4000"
    volumes:
      - workspaces:/workspaces
      - engines:/engines
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudai
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?set SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: cloudai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudai -d cloudai"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  postgres-data:
  workspaces:
  engines:
